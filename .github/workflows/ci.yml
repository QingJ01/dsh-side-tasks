name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify Harness adapter pack
        run: node compat/verify-adapter-pack.mjs
      - name: Verify package contents
        run: |
          pnpm --filter dsh-side-tasks pack --pack-destination dist
          node packages/plugins/side-tasks/scripts/verify-pack.mjs dist/dsh-side-tasks-0.1.0.tgz
